name: r26_it_122
description: "HeritageAR – AI-Powered Offline AR Heritage Exploration System."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera feed
  camera: ^0.10.5+9

  # On-device TFLite inference
  tflite_flutter: ^0.12.1

  # Image conversion for camera frames
  image: ^4.2.0

  # Offline SQLite database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # File-system path helper
  path_provider: ^2.1.4

  # GPS/geofence-based landmark site lock
  permission_handler: ^12.0.1
  onnxruntime: ^1.4.1
  llama_cpp_dart: ^0.2.2

  # ML Kit (Offline OCR and Translation)
  google_mlkit_text_recognition: ^0.13.1

  # Voice chat – fully offline STT & TTS via device engines
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Compass heading for AR navigation arrow
  flutter_compass: ^0.8.0

  # AR engine (ARCore / ARKit) - disabled until NDK+AGP compat resolved
  # ar_flutter_plugin: ^0.7.3

  # Heritage Map (OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^14.0.3
  google_mlkit_translation: ^0.11.1

  # Renders the 3D AR navigation arrow (.glb) via an offline local WebView
  model_viewer_plus: ^1.10.0

  # Step detection for surveyed-segment walking progress (AR nav countdown)
  pedometer: ^4.2.0

  # Accelerometer motion gate: GPS position drift alone isn't reliable
  # evidence of walking (a stationary phone's fix can still wander several
  # meters), so AR nav cross-checks real device motion before crediting any
  # GPS-derived distance to the route countdown.
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/landmark_model.tflite
    - assets/models/minilm.onnx
    - "assets/models/Arrow by Max Level - 1TUCDmHZKQY.glb"
    - assets/images/
    - assets/embeddings/
    - assets/config/
    - assets/data/
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
